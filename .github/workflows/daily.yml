name: Douyu Daily Job

on:
  schedule:
    # 定时任务使用 UTC 时间，北京时间 = UTC + 8
    # 下面 0 4 * * * 表示 UTC 04:00，即北京时间 12:00
    # 修改方法见 README「第六步：修改运行时间」
    - cron: '0 4 * * *'
  # 允许在 Actions 页面手动点击运行
  workflow_dispatch:

concurrency:
  group: douyu-worker
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # 没有配置 Cookie 时直接跳过，避免模板仓库或尚未配置的仓库出现失败运行
      - name: Check cookie
        id: cookie
        env:
          DOUYU_COOKIE: ${{ secrets.DOUYU_COOKIE }}
        run: |
          if [ -n "$DOUYU_COOKIE" ] || [ -s .github/douyu_cookie.txt ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未检测到 Cookie，已跳过本次运行。请按 README 第四步完成配置。"
          fi

      - name: Run job
        if: steps.cookie.outputs.ready == 'true'
        env:
          # 优先读取仓库内 .github/douyu_cookie.txt（由油猴脚本自动同步）
          # 如果没有该文件，才会使用下面 Secrets 里的 DOUYU_COOKIE
          DOUYU_COOKIE: ${{ secrets.DOUYU_COOKIE }}
          NOTIFY_TYPE: ${{ vars.NOTIFY_TYPE }}
          NOTIFY_KEY: ${{ secrets.NOTIFY_KEY }}
        run: npm run job